window.addEventListener('keydown',e=>{if(hostPaused)return;if(e.key==='Escape'){if(playing)pause();return;}if(!active||!playing||userPaused)return;if(active.key){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(!e.repeat)active.key(e.key);return;}if(['ArrowLeft','ArrowRight',' ','a','d'].includes(e.key))e.preventDefault();if(e.repeat)return;keys.add(e.key);if(active.s.id==='pinball'){if(e.key==='ArrowLeft'||e.key==='a')active.action('left',true);if(e.key==='ArrowRight'||e.key==='d')active.action('right',true);if(e.key===' ')active.action('launch');}else if(e.key===' ')active.action();});
window.addEventListener('keyup',e=>{keys.delete(e.key);if(!active||hostPaused)return;if(e.key==='ArrowLeft'||e.key==='a')active.action('left',false);if(e.key==='ArrowRight'||e.key==='d')active.action('right',false);if(e.key===' ')active.action('main',false);});
function route(){if(hostPaused)return;const id=window.GAME_ID||location.hash.slice(1);if(id)openGame(id);else gallery();}
window.addEventListener('hashchange',()=>{if(!standalone)route();});route();platform.ready();clearTimeout(window.__bootTimer);
})();</script></body></html>
